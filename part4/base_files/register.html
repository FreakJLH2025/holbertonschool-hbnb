<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/icon.png">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="App Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" id="login-link">Login</a>
            <a href="register.html" id="register-link">Register</a>
            <a href="#" id="logout-link" style="display: none;">Logout</a>
            <span id="user-greeting" style="margin-left: 15px;"></span>
        </nav>
    </header>

<main>
    <form id="register-form" class="form login-form">

        <h2>Create Account</h2>

        <label for="first_name">First Name:</label>
        <input type="text" id="first_name" required>

        <label for="last_name">Last Name:</label>
        <input type="text" id="last_name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" required>

        <p>You already have an account? <a href="login.html">Login here</a></p>

        <button type="submit">Register</button>

    </form>
</main>

<footer>
    <p>All rights reserved © 2026</p>
</footer>

<script src="scripts.js"></script>

</body>
</html>
