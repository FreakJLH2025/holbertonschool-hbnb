<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="images/icon.png">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="App Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" id="login-link">Login</a>
            <a href="register.html" id="register-link">Register</a>
            <a href="#" id="logout-link" style="display: none;">Logout</a>
            <span id="user-greeting" style="margin-left: 15px;"></span>
        </nav>
    </header>

    <main>
        <form id="login-form" class="form login-form">
            <h2>Login</h2>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <p>You don't have and account yet? <a href="register.html">Register here</a></p>
            
            <button type="submit">Login</button>
        </form>
    </main>

    <footer>
        <p>All rights reserved © 2026</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
